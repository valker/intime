apply plugin: 'com.android.application'

def gitLastCommitHash = providers.exec {
    commandLine('git', 'rev-parse', '--short', 'HEAD')
}.standardOutput.asText.get().toString().trim()

android {
    compileSdk 34

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.vpe_soft.intime.intime"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 21
        versionName "1.1.8"
        buildConfigField "String", "GIT_LAST_COMMIT_HASH", "\"${gitLastCommitHash}\""
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.vpe_soft.intime.intime'
}

dependencies {
    //implementation 'androidx.activity:activity:1.10.0'
    def room_version = "2.6.1"  // Актуальная версия на февраль 2025
    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")  // Для Java
    implementation("androidx.room:room-ktx:$room_version")  // Если добавим корутины
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.6.2") // Для LiveData
    implementation("androidx.core:core-ktx:1.12.0")  // Нужна для @NonNull

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
