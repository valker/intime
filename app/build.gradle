apply plugin: 'com.android.application'

// Только для smoke-обновления на проектном AVD; обычные сборки сохраняют пакет .dev.
def upgradeSmoke = providers.gradleProperty('upgradeSmoke').getOrElse('false') == 'true'
// Production включается явно; версия передаётся при сборке, а .dev остаётся по умолчанию.
def productionRelease = providers.gradleProperty('productionRelease').getOrElse('false') == 'true'
def unsignedProduction = providers.gradleProperty('unsignedProduction').getOrElse('false') == 'true'
def productionCode = providers.gradleProperty('releaseVersionCode').getOrElse('')
def productionName = providers.gradleProperty('releaseVersionName').getOrElse('')
if (productionRelease && upgradeSmoke) {
    throw new GradleException('productionRelease and upgradeSmoke are mutually exclusive')
}
if (unsignedProduction && !productionRelease) {
    throw new GradleException('unsignedProduction requires productionRelease')
}
if (productionRelease) {
    if (!productionCode.isInteger() || productionCode.toInteger() <= 24 || productionCode.toInteger() > 2100000000) {
        throw new GradleException('releaseVersionCode must be an integer in 25..2100000000; check used Play codes first')
    }
    if (!(productionName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?/)) {
        throw new GradleException('releaseVersionName is required, for example 2.0.0-rc1')
    }
    if (gradle.startParameter.taskNames.isEmpty() || gradle.startParameter.taskNames.any {
        !(it in [':app:assembleRelease', ':app:bundleRelease'])
    }) {
        throw new GradleException('productionRelease permits only :app:assembleRelease and :app:bundleRelease')
    }
}
if (upgradeSmoke && gradle.startParameter.taskNames.any {
    !(it in [':app:assembleDebug', ':app:assembleDebugAndroidTest', ':app:testDebugUnitTest'])
}) {
    throw new GradleException('upgradeSmoke permits only explicit debug build/test tasks')
}

def gitLastCommitHash = providers.exec {
    commandLine('git', 'rev-parse', '--short', 'HEAD')
}.standardOutput.asText.get().toString().trim()

android {
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        encoding 'UTF-8'
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    defaultConfig {
        applicationId ((upgradeSmoke || productionRelease) ? 'com.vpe_soft.intime.intime' : 'com.vpe_soft.intime.intime.dev')
        minSdkVersion 24
        targetSdkVersion 35
        versionCode (productionRelease ? productionCode.toInteger() : (upgradeSmoke ? 25 : 21))
        versionName (productionRelease ? productionName : (upgradeSmoke ? '1.1.8-upgrade-smoke' : '1.1.8'))
        buildConfigField "String", "GIT_LAST_COMMIT_HASH", "\"${gitLastCommitHash}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        testInstrumentationRunner (upgradeSmoke ? 'com.vpe_soft.intime.intime.database.UpgradeSmokeInstrumentation' : 'androidx.test.runner.AndroidJUnitRunner')
    }
    signingConfigs {
        release {
            // Неподписанный кандидат не использует даже настроенные credentials.
            if (unsignedProduction) {
                // Подпись проверяется отдельной production-сборкой без этого флага.
            } else if (System.getenv("SIGNING_KEY_STORE_PATH")) {
                storeFile = file(System.getenv("SIGNING_KEY_STORE_PATH"))
                storePassword = System.getenv("SIGNING_KEY_STORE_PASSWORD")
                keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
            } else if (project.hasProperty("SIGNING_KEY_STORE_PATH")) {
                storeFile = file(project.property("SIGNING_KEY_STORE_PATH"))
                storePassword = project.property("SIGNING_KEY_STORE_PASSWORD")
                keyAlias = project.property("SIGNING_KEY_ALIAS")
                keyPassword = project.property("SIGNING_KEY_PASSWORD")
            }
        }
    }

    if (productionRelease && !unsignedProduction) {
        def upload = signingConfigs.release
        if (!upload.storeFile || !upload.storePassword || !upload.keyAlias || !upload.keyPassword) {
            throw new GradleException('Production signing requires all four SIGNING_KEY_* values; use unsignedProduction only for a preview')
        }
        // Проверяем публичный сертификат upload key, не записывая пароли в отчёт.
        def keyStore = java.security.KeyStore.getInstance(upload.storeType ?: 'JKS')
        upload.storeFile.withInputStream { stream -> keyStore.load(stream, upload.storePassword.toCharArray()) }
        def certificate = keyStore.getCertificate(upload.keyAlias)
        if (!certificate || !keyStore.isKeyEntry(upload.keyAlias)) {
            throw new GradleException('Production upload alias must contain a private key and certificate')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (digest != '97b60110a8e894791b4770826a8d214dc5e3a551cd24bd41d646c29f64a1dd26') {
            throw new GradleException('Production upload certificate differs from the confirmed Play upload certificate')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig = signingConfigs.release
            }
        }
    }
    namespace 'com.vpe_soft.intime.intime'

    sourceSets {
        // Проверьте, что указано 'androidTest', а не просто 'test' или 'main'
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'file.encoding', 'UTF-8'
            systemProperty 'user.timezone', 'UTC'
            if (project.hasProperty('testOffline')) {
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', rootProject.file('.test-tools/robolectric').absolutePath
            }
        }
    }
}

// Always produce fresh test results without recompiling every prerequisite task.
if (project.hasProperty('forceTestRun')) {
    tasks.configureEach {
        if (name in ['testDebugUnitTest', 'connectedDebugAndroidTest']) {
            outputs.upToDateWhen { false }
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'

    def room_version = "2.8.4"  // Актуальная версия на февраль 2025
    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")  // Для Java

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20251224'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.work:work-testing:2.11.2'

    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.work:work-testing:2.11.2'
    androidTestImplementation("androidx.room:room-testing:$room_version")
}
