apply plugin: "com.android.application"

def gitLastCommitHashProvider = providers.exec {
    commandLine("git", "rev-parse", "--short", "HEAD")
}.standardOutput.asText.map {
    it.trim()
}.orElse("nogit")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

android {
    // компилируем под Java 21
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    compileSdk = 36 // NOTICE: обновить в .gitlab-ci.yml при обновлении

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.vpe_soft.intime.intime"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode = 24
        versionName = "1.1.11"
        buildConfigField "String", "GIT_LAST_COMMIT_HASH", providers.provider { "\"${gitLastCommitHashProvider.get()}\"" }.get()
    }

    buildTypes {
        debug {
            lint {
                abortOnError = false
                // не прерываем сборку, если линтер нашел ошибки (только запишем в отчет)
            }
        }

        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    namespace = "com.vpe_soft.intime.intime"
}

dependencies {
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
}
