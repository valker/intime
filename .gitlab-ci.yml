# Intime GitLab CI Pipeline
# Цели:
#  - собрать APK (assembleDebug)
#  - прогнать lint (lintDebug)
#  - прогнать unit-тесты (debugTests)
# Версии (09.01.2026):
#  - compileSdk 36
#  - commandline-tools 13114758
#  - JDK 21 (на базе Ubuntu 24.04)

image: eclipse-temurin:21-jdk-noble

stages:
  - build
  - test

variables:
  # Версия Android SDK и Android Build Tools, которые будут установлены через sdkmanager.
  # Должны совпадать с версиями, указанными в build.gradle.
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

  # Версия Android commandline-tools.
  # Берётся из официальной страницы загрузок: https://developer.android.com/studio#command-tools
  ANDROID_SDK_TOOLS: "13114758"

  # Ставим Android SDK в директорию внутри проекта для кэширования.
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"

  # Gradle user home также кладём в репозиторий, чтобы кэшировать wrapper и gradle caches.
  # (По умолчанию Gradle пишет в ~/.gradle, что в CI не переживает перезапуски.)
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

  # Аргументы для Gradle:
  #  - daemon=false: чтобы не держать фоновые процессы в контейнере
  #  - Xmx3g: ограничение памяти для JVM Gradle
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

  # Аргументы для gradlew:
  # --console=plain: читаемые логи в GitLab
  # --stacktrace: печатать stacktrace при падении
  # -Pci: тип сборки=ci, чтобы в build.gradle можно было менять поведение под CI
  CI_GRADLE_ARGS: "--console=plain --stacktrace -Pci"

# Используем кэширование между запусками job'ов в пределах ветки, чтобы ускорить сборку.
cache:
  # Ключ кэша: имя проекта + ветка.
  key: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"

  # pull-push:
  #  - перед job пробуем скачать кэш (pull)
  #  - после job загружаем обновлённый кэш (push)
  policy: pull-push

  paths:
    # Кэш Gradle (зависимости, трансформы, metadata).
    - .gradle/caches/

    # Gradle wrapper (дистрибутив gradle-*.zip), чтобы не скачивать каждый раз.
    - .gradle/wrapper/

    # Установленный Android SDK (platforms/build-tools/platform-tools/cmdline-tools).
    - android-sdk/

before_script:
  # Минимальная подготовка окружения
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes unzip git wget ca-certificates

  # Готовим директорию под Android SDK.
  - install -d "$ANDROID_SDK_ROOT"

  # Скачиваем Android commandline-tools и кладём в ANDROID_SDK_ROOT.
  - wget --quiet --output-document="$ANDROID_SDK_ROOT/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip"
  - rm -rf "$ANDROID_SDK_ROOT/cmdline-tools"
  - install -d "$ANDROID_SDK_ROOT/cmdline-tools"
  - unzip -q -d "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools.zip"
  - rm -f "$ANDROID_SDK_ROOT/cmdline-tools.zip"

  # Приводим структуру к ожидаемой: cmdline-tools/latest/bin
  - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

  # Добавляем sdkmanager и platform-tools в PATH.
  - export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"

  # Пишем версию sdkmanager в лог.
  - sdkmanager --version

  # Принимаем лицензионные соглашения.
  - yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

  # Установка компонентов SDK.
  # Если они уже есть в кэше android-sdk/, sdkmanager быстро пропустит.
  - sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-${ANDROID_COMPILE_SDK}" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}"

  # Удостоверяемся, что скрипт gradlew имеет права на исполнение.
  - chmod +x ./gradlew

lintDebug:
  stage: build
  interruptible: true
  script:
    - ./gradlew ${CI_GRADLE_ARGS} :app:lintDebug
  artifacts:
    when: always # сохраняем отчеты всегда
    expire_in: 7 days
    paths:
      # HTML и XML отчёты lint.
      - app/build/reports/lint-results-*.html
      - app/build/reports/lint-results-*.xml

assembleDebug:
  stage: build
  interruptible: true
  script:
    - ./gradlew ${CI_GRADLE_ARGS} assembleDebug
  artifacts:
    # Сохраняем результаты сборки.
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/
      - app/build/outputs/bundle/

debugTests:
  stage: test
  interruptible: true
  script:
    - ./gradlew ${CI_GRADLE_ARGS} :app:testDebug
  artifacts:
    # Тестовые отчёты сохраняем всегда, чтобы можно было посмотреть результаты даже при падении.
    when: always
    expire_in: 7 days
    reports:
      # JUnit XML, который GitLab умеет отображать в UI.
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      # HTML отчёт тестов (Gradle test report).
      - app/build/reports/tests/
