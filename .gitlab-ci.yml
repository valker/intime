# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Android.gitlab-ci.yml

# Read more about this script on this blog post https://about.gitlab.com/2018/10/24/setting-up-gitlab-ci-for-android-projects/, by Jason Lenny
# If you are interested in using Android with FastLane for publishing take a look at the Android-Fastlane template.

image: ubuntu:20.04

variables:

  # Установка пакетов в CI не должна ждать ответов debconf (в том числе tzdata).
  DEBIAN_FRONTEND: "noninteractive"
  # Фиксируем таймзону контейнера для воспроизводимых сборок и тестов.
  TZ: "Etc/UTC"

  # ANDROID_COMPILE_SDK is the version of Android you're compiling with.
  # It should match compileSdkVersion.
  ANDROID_COMPILE_SDK: "36"

  # ANDROID_BUILD_TOOLS is the version of the Android build tools you are using.
  # It should match buildToolsVersion.
  ANDROID_BUILD_TOOLS: "35.0.0"

  # It's what version of the command line tools we're going to download from the official site.
  # Official Site-> https://developer.android.com/studio/index.html
  # There, look down below at the cli tools only, sdk tools package is of format:
  #        commandlinetools-os_type-ANDROID_SDK_TOOLS_latest.zip
  # when the script was last modified for latest compileSdkVersion, it was which is written down below
  ANDROID_SDK_TOOLS: "8092744"

  ANDROID_HOME: "/sdk"

  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"

# Packages installation before running script
before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes openjdk-17-jdk wget tar unzip git lib32stdc++6 lib32z1 tzdata
  # Применяем UTC также к системной конфигурации установленного tzdata.
  - ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime
  - printf '%s\n' "$TZ" > /etc/timezone
  - dpkg-reconfigure --frontend noninteractive tzdata

  # Setup path as android_home for moving/exporting the downloaded sdk into it
  - export ANDROID_HOME="${PWD}/android-home"
  # Create a new directory at specified location
  - install -d $ANDROID_HOME
  # Here we are installing androidSDK tools from official source,
  # (the key thing here is the url from where you are downloading these sdk tool for command line, so please do note this url pattern there and here as well)
  # after that unzipping those tools and
  # then running a series of SDK manager commands to install necessary android SDK packages that'll allow the app to build
  - wget --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
  # move to the archive at ANDROID_HOME
  - pushd $ANDROID_HOME
  - unzip -d cmdline-tools cmdline-tools.zip
  - popd
  - export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/cmdline-tools/bin/

  # Nothing fancy here, just checking sdkManager version
  - sdkmanager --version

  # use yes to accept all licenses
  - yes | sdkmanager --sdk_root=${ANDROID_HOME} --licenses || true
  - sdkmanager --sdk_root=${ANDROID_HOME} "platforms;android-${ANDROID_COMPILE_SDK}"
  - sdkmanager --sdk_root=${ANDROID_HOME} "platform-tools"
  - sdkmanager --sdk_root=${ANDROID_HOME} "build-tools;${ANDROID_BUILD_TOOLS}"

  # Not necessary, but just for surity
  - chmod +x ./gradlew

# Basic android and gradle stuff
# Check linting
lintDebug:
  interruptible: true
  stage: build
  script:
    - ./gradlew -Pci --console=plain --no-watch-fs :app:lintDebug

# Make Project
assembleDebug:
  interruptible: true
  stage: build
  script:
    - echo "JAVA_HOME - ${JAVA_HOME}"
    - ./gradlew --no-watch-fs assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/

# Run all tests, if any fails, interrupt the pipeline(fail it)
debugTests:
  interruptible: true
  stage: test
  script:
    - ./gradlew -Pci --console=plain --no-watch-fs :app:testDebugUnitTest
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/test-results/testDebugUnitTest/

instrumentedTests:
  stage: test
  when: manual
  tags:
    - android-emulator
  script:
    - test -r /dev/kvm && test -w /dev/kvm
    - sdkmanager --sdk_root=${ANDROID_HOME} "emulator" "system-images;android-35;google_apis;x86_64"
    - echo no | avdmanager create avd --name Intime_CI_API35 --package "system-images;android-35;google_apis;x86_64"
    - '${ANDROID_HOME}/emulator/emulator -avd Intime_CI_API35 -port 5580 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &'
    - export ANDROID_SERIAL=emulator-5580
    - timeout 300 bash -c 'until adb -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q "^1$"; do sleep 2; done'
    - ./gradlew --console=plain --no-watch-fs :app:connectedDebugAndroidTest
  after_script:
    - ${CI_PROJECT_DIR}/android-home/platform-tools/adb -s emulator-5580 logcat -d > logcat.log || true
    - ${CI_PROJECT_DIR}/android-home/platform-tools/adb -s emulator-5580 emu kill || true
  artifacts:
    when: always
    reports:
      junit: app/build/outputs/androidTest-results/connected/debug/**/*.xml
    paths:
      - app/build/outputs/androidTest-results/
      - app/build/reports/androidTests/
      - emulator.log
      - logcat.log
